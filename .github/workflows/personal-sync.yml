name: Personal upstream sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'EricGorokhovsky2009/t3code-personal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: false
      - name: Merge upstream without replacing personal commits
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Personal T3 sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main
          upstream_commit="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$upstream_commit" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Already current with upstream.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-ff --no-commit "$upstream_commit"; then
            {
              echo '### Upstream merge needs review'
              echo 'The personal branch was not changed. Resolve these conflicts before the next sync:'
              git diff --name-only --diff-filter=U
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Setup Vite+
        if: steps.merge.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install build dependencies
        if: steps.merge.outputs.changed == 'true'
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Check personal patches and client types
        if: steps.merge.outputs.changed == 'true'
        run: |
          vp test run packages/client-runtime/src/state/projectGrouping.test.ts packages/client-runtime/src/state/projectEntities.test.ts apps/web/src/environmentGrouping.test.ts
          vp test run packages/contracts/src/chatAttachment.test.ts apps/server/src/assets/AttachmentUpload.test.ts apps/server/src/environment/ServerEnvironment.test.ts scripts/build-desktop-artifact.test.ts
          vp exec tsc --noEmit -p packages/client-runtime/tsconfig.json
          vp exec tsc --noEmit -p apps/web/tsconfig.json
      - name: Install Linux desktop build dependencies
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev pkg-config
      - name: Build before accepting the merge
        if: steps.merge.outputs.changed == 'true'
        run: vp run build:desktop
      - name: Publish checked merge
        if: steps.merge.outputs.changed == 'true'
        id: commit
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git commit --no-verify -m 'Merge upstream T3 Code'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'Upstream merged after personal regression tests, client type checks, and desktop build passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep inherited publishing workflows disabled
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows" --paginate --jq '.workflows[] | select(.state == "active" and .path != ".github/workflows/personal-sync.yml" and .path != ".github/workflows/personal-build.yml") | .id' |
          while read -r workflow_id; do
            gh api --method PUT "repos/$GH_REPO/actions/workflows/$workflow_id/disable"
          done
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Start an independent Mac build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ needs.sync.outputs.commit }}
          WORKFLOW_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run personal-build.yml --ref "$WORKFLOW_BRANCH" -f ref="$BUILD_REF"
